name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DEPLOY_HOST: ${{ secrets.PROD_HOST }}
  DEPLOY_USER: ${{ secrets.PROD_USER }}
  DEPLOY_PORT: ${{ secrets.PROD_PORT || 22 }}
  DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}

jobs:
  # ─── Quality Gates ──────────────────────────────────────────────
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Production build (quality gate)
        run: npm run build

      - name: Verify dist output
        run: |
          test -d dist || exit 1
          test -f dist/index.html || exit 1
          echo "Build artifact verified"

  # ─── Security Scan (Optional) ────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
      - name: Run npm audit
        run: npm audit --audit-level=moderate || echo "Security check complete"

  # ─── Deploy (Production Only) ───────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Build
        run: npm ci && npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p $DEPLOY_PORT $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Create deployment version
        id: deploy_info
        run: |
          VERSION=$(date +%Y%m%d_%H%M%S)_$(echo ${{ github.sha }} | cut -c1-7)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"

      - name: Upload to production
        env:
          VERSION: ${{ steps.deploy_info.outputs.version }}
        run: |
          scp -r -P $DEPLOY_PORT dist/* $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/releases/$VERSION/

      - name: Switch symlink and health check
        env:
          VERSION: ${{ steps.deploy_info.outputs.version }}
        run: |
          ssh -p $DEPLOY_PORT $DEPLOY_USER@$DEPLOY_HOST << 'DEPLOY_SCRIPT'
          set -e
          DEPLOY_PATH="${{ env.DEPLOY_PATH }}"
          VERSION="${{ env.VERSION }}"
          
          # Backup current symlink
          if [ -L "$DEPLOY_PATH/current" ]; then
            PREV=$(readlink "$DEPLOY_PATH/current")
            echo "Previous version: $PREV"
          fi
          
          # Switch to new version
          cd "$DEPLOY_PATH"
          ln -sfn "releases/$VERSION" current.tmp
          mv -Tf current.tmp current
          echo "Switched to version: $VERSION"
          
          # Health check
          sleep 2
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/index.html || echo "000")
          
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "304" ]; then
            echo "Health check passed (HTTP $HTTP_CODE)"
          else
            echo "Health check failed (HTTP $HTTP_CODE), rolling back..."
            if [ -L "$DEPLOY_PATH/current" ] && [ -n "$PREV" ]; then
              ln -sfn "releases/$PREV" current
              echo "Rolled back to $PREV"
            fi
            exit 1
          fi
          
          # Cleanup old releases (keep last 5)
          cd "$DEPLOY_PATH/releases"
          ls -t -d */ | tail -n +6 | xargs -r rm -rf
          echo "Cleanup completed"
          DEPLOY_SCRIPT

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "Version: ${{ steps.deploy_info.outputs.version }}"
          echo "Commit: ${{ github.sha }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed or health check failed"
          echo "Check the logs above for details"
          exit 1
